<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Android Ports</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <button id="menu-button" type="button">
        ☰
    </button>

    <h1 id="home-button">Community Android Ports</h1>

    <button
        id="search-button"
        type="button"
        aria-label="Open search"
    >
        🔍
    </button>
    
</header>


<div id="menu-overlay"></div>


<nav id="side-menu">

    <button id="menu-close" type="button">
        ×
    </button>

    <h2>Games</h2>

    <button
        id="all-games-button"
        type="button"
        class="platform-button"
    >
        All Games
    </button>

    <h2>Categories</h2>

    <div id="platform-list"></div>

</nav>


<main>

    <div
        id="search-container"
        class="search-container"
        hidden
    >

        <input
            type="text"
            id="search"
            placeholder="Search game..."
            autocomplete="off"
        >

    </div>


    <section
        id="last-updated-section"
        class="home-section"
    >

        <h2>Last Updated</h2>

        <div id="last-updated-list"></div>

        <button
            id="last-updated-more"
            class="home-view-more"
            type="button"
            hidden
        >
            View more →
        </button>

    </section>


    <section
        id="popular-section"
        class="home-section"
    >

        <div class="home-section-header">

            <h2>Popular</h2>

            <div class="popular-tabs">

                <button
                    class="popular-tab active"
                    data-period="week"
                    type="button"
                >
                    Week
                </button>

                <button
                    class="popular-tab"
                    data-period="month"
                    type="button"
                >
                    Month
                </button>

                <button
                    class="popular-tab"
                    data-period="alltime"
                    type="button"
                >
                    All Time
                </button>

            </div>

        </div>


        <div id="popular-list"></div>


        <button
            id="popular-more"
            class="home-view-more"
            type="button"
        >
            View more →
        </button>

    </section>


    <div id="status"></div>


    <div id="game-list" hidden></div>


    <p class="game-files-link">

        Game files available

        <a
            href="https://docs.google.com/spreadsheets/d/1wXlykMGC7rQCgebOkA4Awtd4wN9nMHCTkZUFf4KHQ-k/edit?usp=drivesdk"
            target="_blank"
            rel="noopener noreferrer"
        >
            here
        </a>

    </p>

</main>


<footer>

    <p>
        Community Android Ports
    </p>

</footer>


<script src="app.js"></script>

</body>
</html>
