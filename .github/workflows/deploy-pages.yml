name: Deploy NAPL to GitHub Pages

on:
  push:
    branches: ["main", "v4"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout NAPL-Data public catalog & WebP covers
        if: ${{ secrets.NAPL_DATA_GITHUB_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: Fe2rr/NAPL-Data
          ref: main
          path: _napl_data
          token: ${{ secrets.NAPL_DATA_GITHUB_TOKEN }}

      - name: Bundle NAPL-Data static assets into public/
        if: ${{ secrets.NAPL_DATA_GITHUB_TOKEN != '' }}
        run: |
          if [ -f "_napl_data/public/assets/data/catalog.json" ]; then
            mkdir -p public/assets/data
            cp "_napl_data/public/assets/data/catalog.json" "public/assets/data/catalog.json"
            echo "Bundled catalog.json from NAPL-Data"
          fi
          if [ -d "_napl_data/public/assets/covers" ]; then
            mkdir -p public/assets/covers
            cp -R _napl_data/public/assets/covers/. public/assets/covers/
            echo "Bundled static WebP covers from NAPL-Data"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
