name: Deploy NAPL to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "scripts/**"
      - ".github/workflows/deploy-pages.yml"
      - "cloudflare-community/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate NAPL data token
        env:
          NAPL_DATA_GITHUB_TOKEN: ${{ secrets.NAPL_DATA_GITHUB_TOKEN }}
        run: |
          if [ -z "$NAPL_DATA_GITHUB_TOKEN" ]; then
            echo "::error::Missing repository secret NAPL_DATA_GITHUB_TOKEN."
            exit 1
          fi

      - name: Checkout NAPL-Data
        uses: actions/checkout@v4
        with:
          repository: Fe2rr/NAPL-Data
          ref: main
          path: _napl_data
          token: ${{ secrets.NAPL_DATA_GITHUB_TOKEN }}
          persist-credentials: false

      - name: Bundle catalog, device shards and WebP covers
        run: |
          mkdir -p public/assets/data public/assets/covers
          cp -a _napl_data/public/assets/data/. public/assets/data/
          if [ -d _napl_data/public/assets/covers ]; then
            cp -a _napl_data/public/assets/covers/. public/assets/covers/
          fi
          test -s public/assets/data/catalog.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
