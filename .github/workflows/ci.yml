name: NAPL project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          find public/js public/admin scripts lib -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check
      - name: Verify admin module imports and active architecture
        run: |
          node --input-type=module -e "import('./public/js/lib/github-admin.js').then(m => { if (typeof m.fetchCommunityAdminDashboard !== 'function') process.exit(1); })"
          test -s public/admin/index.html
          test -s public/admin/admin.js
          test -s public/admin/admin.css
          grep -q 'fetchCommunityAdminDashboard' public/admin/admin.js
          grep -q 'private/link-reports.json' public/js/lib/github-admin.js
          ! grep -q 'COMMUNITY_API_BASE' public/js/lib/github-admin.js
          ! grep -R -n -E 'ADMIN_DASHBOARD_API_URL|napl-community-api|napl-admin-api|napl-image-optimizer|Napl-prueba|cloudflare-community' public/js public/admin scripts lib
