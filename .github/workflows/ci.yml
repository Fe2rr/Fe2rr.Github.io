name: NAPL static and Cloudflare validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          find public/js scripts lib cloudflare cloudflare-community -type f \\( -name '*.js' -o -name '*.mjs' \\) -print0 | xargs -0 -n1 node --check
      - name: Verify static admin entrypoints
        run: |
          test -s public/admin/index.html
          test -s public/admin/admin.js
          test -s public/admin/admin.css
          grep -q 'github-admin.js' public/admin/admin.js
          grep -q 'napl-community-api' public/js/lib/config.js
