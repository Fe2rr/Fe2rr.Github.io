name: NAPL catalog sync

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync-catalog.mjs"
      - "lib/catalog-core.mjs"
      - "lib/cover-optimizer.mjs"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      import_sheets:
        description: "Import the legacy Google Sheets CSV (only if intentionally refreshing from that source)"
        required: false
        type: boolean
        default: false
      optimize_covers:
        description: "Pre-optimize cover images into static WebP assets"
        required: false
        type: boolean
        default: true

concurrency:
  group: napl-catalog-sync
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout NAPL-Prueba
        uses: actions/checkout@v4

      - name: Validate required Actions secrets
        env:
          NAPL_DATA_GITHUB_TOKEN: ${{ secrets.NAPL_DATA_GITHUB_TOKEN }}
        run: |
          test -n "$NAPL_DATA_GITHUB_TOKEN" || { echo "::error::Missing Actions secret NAPL_DATA_GITHUB_TOKEN"; exit 1; }

      - name: Checkout NAPL-Data assets repository
        uses: actions/checkout@v4
        with:
          repository: Fe2rr/NAPL-Data
          ref: main
          path: data
          token: ${{ secrets.NAPL_DATA_GITHUB_TOKEN }}

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install local cwebp tool (best-effort)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp

      - name: Run pure-Node catalog sync & WebP optimization
        env:
          GITHUB_TOKEN: ${{ secrets.NAPL_DATA_GITHUB_TOKEN }}
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          IMPORT_SHEETS: ${{ github.event_name == 'workflow_dispatch' && inputs.import_sheets || 'false' }}
          OPTIMIZE_COVERS: ${{ github.event_name == 'workflow_dispatch' && inputs.optimize_covers || 'true' }}
          NAPL_DATA_DIR: data
          SYNC_CONCURRENCY: "6"
        run: node scripts/sync-catalog.mjs

      - name: Commit updated catalog state, public JSON and WebP covers
        id: commit_data
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add private/catalog-state.json public/assets/data/catalog.json public/assets/covers
          if ! git diff --cached --quiet; then
            git commit -m "NAPL: sync catalog and static WebP covers"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No catalog or cover changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger GitHub Pages redeploy when public assets changed
        if: steps.commit_data.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "${{ github.repository }}"
