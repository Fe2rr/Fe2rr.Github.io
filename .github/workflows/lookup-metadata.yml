name: NAPL metadata lookup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Lookup mode: launchbox | steam | itch | port_source | optimize_cover"
        required: true
        type: choice
        options:
          - launchbox
          - steam
          - itch
          - port_source
          - optimize_cover
      url:
        description: "Target URL, AppID, or owner/repo"
        required: true
        type: string
      request_id:
        description: "Optional request correlation ID from NAPL Admin"
        required: false
        type: string
        default: ""

concurrency:
  group: napl-metadata-lookup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout NAPL-Prueba
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            lib
            scripts/lookup-metadata.mjs
            public/js/lib/source-parsers.js
          sparse-checkout-cone-mode: false

      - name: Validate required Actions secrets
        env:
          NAPL_DATA_GITHUB_TOKEN: ${{ secrets.NAPL_DATA_GITHUB_TOKEN }}
        run: |
          test -n "$NAPL_DATA_GITHUB_TOKEN" || { echo "::error::Missing Actions secret NAPL_DATA_GITHUB_TOKEN"; exit 1; }

      - name: Checkout NAPL-Data assets repository
        if: inputs.mode == 'optimize_cover'
        uses: actions/checkout@v4
        with:
          repository: Fe2rr/NAPL-Data
          ref: main
          path: data
          token: ${{ secrets.NAPL_DATA_GITHUB_TOKEN }}

      - name: Run metadata lookup
        env:
          GITHUB_TOKEN: ${{ secrets.NAPL_DATA_GITHUB_TOKEN }}
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          LOOKUP_MODE: ${{ inputs.mode }}
          LOOKUP_URL: ${{ inputs.url }}
          LOOKUP_REQUEST_ID: ${{ inputs.request_id }}
          NAPL_DATA_DIR: data
          NAPL_DATA_REPO: Fe2rr/NAPL-Data
          NAPL_DATA_BRANCH: main
          NAPL_WRITE_VIA_API: ${{ (inputs.mode != 'optimize_cover' && inputs.request_id != '') && '1' || '0' }}
        run: node scripts/lookup-metadata.mjs

      - name: Commit lookup result and cover assets
        if: inputs.mode == 'optimize_cover'
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d "private/lookup-results" ]; then
            git add -A private/lookup-results
          fi
          if [ -d "public/assets/covers" ]; then
            git add -A public/assets/covers
          fi
          if ! git diff --cached --quiet; then
            git commit -m "NAPL: metadata lookup (${{ inputs.mode }})"
            for attempt in 1 2 3; do
              if ! git pull --rebase origin main; then
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            echo "::error::Failed to push lookup results after 3 attempts."
            exit 1
          else
            echo "No lookup output changes to commit."
          fi
