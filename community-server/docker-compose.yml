services:
  napl-community:
    build:
      context: ..
      dockerfile: community-server/Dockerfile
    container_name: napl-community-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8787"
      HOST: "127.0.0.1"
      SQLITE_PATH: "/data/napl-community.sqlite"
      DEVICES_JSON_PATH: "/app/devices/devices.json"
    network_mode: host
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2-alpine
    container_name: napl-caddy
    restart: unless-stopped
    network_mode: host
    environment:
      NAPL_API_DOMAIN: ${NAPL_API_DOMAIN:-api.napl.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - napl-community

volumes:
  caddy_data:
  caddy_config:
