name = "napl-admin-api"
main = "napl-admin-worker.js"
compatibility_date = "2026-11-20"
compatibility_flags = ["nodejs_compat"]

# 1. Crear base D1:
#    npx wrangler d1 create napl-catalog-db
# 2. Copiar el database_id generado aquí abajo:
[[d1_databases]]
binding = "DB"
database_name = "napl-catalog-db"
database_id = "9c988cf9-9b75-429c-b9de-bf328b472cb8"

# Sincronización automática de fuentes (GitHub, GitLab y Play Store) cada 6 horas
[triggers]
crons = ["0 */6 * * *"]

[vars]
AUTO_PUBLISH_CRON = "true"
CRON_BATCH_SIZE = "20"
