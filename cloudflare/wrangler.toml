name = "napl-admin-api"
main = "napl-admin-worker.js"
compatibility_date = "2026-11-21"
compatibility_flags = []

# El catálogo se almacena en JSON privado en Fe2rr/NAPL-Data.
# No requiere binding D1. Los secretos se configuran en Cloudflare.

[triggers]
crons = ["0 * * * *"]

[vars]
AUTO_PUBLISH_CRON = "true"
CRON_BATCH_SIZE = "10"
