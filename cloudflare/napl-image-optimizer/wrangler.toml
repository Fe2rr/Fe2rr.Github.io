name = "napl-image-optimizer"
main = "worker.js"
compatibility_date = "2026-11-24"
workers_dev = true

[images]
binding = "IMAGES"

[cache]
enabled = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
persist = true
head_sampling_rate = 1

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 0.1
