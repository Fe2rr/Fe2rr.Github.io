<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Details — NAPL</title><meta
    name="description"
    content="Explore native Android ports, supported versions, compatibility information, and details for your favorite games."
>
<meta name="theme-color" content="#0a211f">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<link rel="stylesheet" href="style.css">

<style>
    body,
    button,
    input,
    select,
    textarea {
        font-family: Inter, system-ui, sans-serif;
    }

    #side-menu a.platform-button {
        display: block;
        text-decoration: none;
    }

    #side-menu a.platform-button:link,
    #side-menu a.platform-button:visited {
        color: var(--text-secondary, #c0d3cd);
        text-decoration: none;
    }

    #side-menu a.platform-button:hover {
        background: var(--surface-hover, #164039);
        text-decoration: none;
    }

    #home-button {
        cursor: pointer;
    }

    .ports-section-title {
        margin: 30px 0 8px;
        font-size: 22px;
        color: var(--text-strong, #f0f7f4);
    }

    .ports-section-description {
        margin: 0 0 12px;
        color: var(--text-muted, #a2bdb5);
        font-size: 14px;
        line-height: 1.5;
    }
</style>

</head><body>
    <header>
        <button
            id="menu-button"
            type="button"
            aria-label="Open menu"
        >☰</button>    <h1 id="home-button">NAPL</h1>

    <button
        id="search-button"
        type="button"
        aria-label="Open search"
        aria-controls="search-container"
        aria-expanded="false"
    >
        <svg
            class="search-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-4-4"></path>
        </svg>
    </button>
</header>

<div id="menu-overlay"></div>

<nav id="side-menu">
    <button
        id="menu-close"
        type="button"
        aria-label="Close menu"
    >×</button>

    <h2>Games</h2>

    <a class="platform-button" href="index.html?view=all-games">
        All Games
    </a>

    <h2>Categories</h2>

    <div id="platform-list">
        <div class="menu-separator">Loading platforms...</div>
    </div>
</nav>

<main>
    <div
        id="search-container"
        class="search-container"
        hidden
    >
        <input
            type="text"
            id="search"
            placeholder="Search game..."
            autocomplete="off"
            aria-label="Search games"
        >

        <div
            id="search-results"
            class="search-results"
            hidden
        ></div>
    </div>

    <a
        href="index.html"
        class="back-button"
        id="back-button"
    >← Back to list</a>

    <section
        id="game-header"
        class="game-summary-card"
        aria-label="Game information"
    >
        <div id="game-title">Loading...</div>
        <div id="game-year"></div>
    </section>

    <section id="android-ports-section">
        <h2 class="ports-section-title">Android Ports</h2>

        <p class="ports-section-description">
            Community-made Android ports and projects for this game.
        </p>

        <div id="status" aria-live="polite">
            Loading ports...
        </div>

        <div id="port-list"></div>
    </section>
</main>

<footer>
    <p>NAPL — Native Android Port List</p>
</footer>

<script>
    /*
     * GENERAL NAVIGATION
     */
    document
        .getElementById("home-button")
        .addEventListener("click", function () {
            window.location.href = "index.html";
        });

    document
        .getElementById("back-button")
        .addEventListener("click", function (event) {
            if (!document.referrer) {
                return;
            }

            try {
                if (
                    new URL(document.referrer).origin ===
                    location.origin
                ) {
                    event.preventDefault();
                    history.back();
                }
            } catch (error) {
                // Keep the normal back link if the referrer is invalid.
            }
        });

    /*
     * SIDE MENU
     */
    const menuButton =
        document.getElementById("menu-button");

    const menuClose =
        document.getElementById("menu-close");

    const sideMenu =
        document.getElementById("side-menu");

    const menuOverlay =
        document.getElementById("menu-overlay");

    const platformList =
        document.getElementById("platform-list");

    function closeMenu() {
        sideMenu.classList.remove("open");
        menuOverlay.classList.remove("visible");
    }

    menuButton.addEventListener("click", function () {
        sideMenu.classList.add("open");
        menuOverlay.classList.add("visible");
    });

    menuClose.addEventListener("click", closeMenu);
    menuOverlay.addEventListener("click", closeMenu);

    /*
     * SEARCH ELEMENTS
     */
    const searchButton =
        document.getElementById("search-button");

    const searchContainer =
        document.getElementById("search-container");

    const searchInput =
        document.getElementById("search");

    const searchResults =
        document.getElementById("search-results");

    let gameNames = [];

    /*
     * NORMALIZE TEXT
     */
    function normalizeText(value) {
        return String(value || "")
            .trim()
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");
    }

    /*
     * NORMALIZE A PLATFORM LABEL
     *
     * This removes excess spaces while preserving
     * the spelling and capitalization shown in the Sheet.
     */
    function normalizePlatformLabel(value) {
        return String(value || "")
            .trim()
            .replace(/\s+/g, " ");
    }

    /*
     * PARSE CSV
     *
     * Supports quoted fields, commas inside quoted fields,
     * escaped quotes and line breaks inside quoted fields.
     */
    function parseCSV(csv) {
        const rows = [];

        let row = [];
        let field = "";
        let insideQuotes = false;

        for (let i = 0; i < csv.length; i++) {
            const char = csv[i];

            if (char === '"') {
                if (
                    insideQuotes &&
                    csv[i + 1] === '"'
                ) {
                    field += '"';
                    i++;
                } else {
                    insideQuotes = !insideQuotes;
                }

                continue;
            }

            if (char === "," && !insideQuotes) {
                row.push(field);
                field = "";
                continue;
            }

            if (
                (char === "\n" || char === "\r") &&
                !insideQuotes
            ) {
                if (
                    char === "\r" &&
                    csv[i + 1] === "\n"
                ) {
                    i++;
                }

                row.push(field);
                field = "";

                if (
                    row.some(value => value.trim() !== "")
                ) {
                    rows.push(row);
                }

                row = [];
                continue;
            }

            field += char;
        }

        if (field.length > 0 || row.length > 0) {
            row.push(field);

            if (
                row.some(value => value.trim() !== "")
            ) {
                rows.push(row);
            }
        }

        return rows;
    }

    /*
     * NORMALIZE COLUMN HEADERS
     */
    function normalizeHeader(value) {
        return String(value || "")
            .replace(/^\uFEFF/, "")
            .trim()
            .toUpperCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");
    }

    /*
     * CREATE MENU SEPARATOR
     */
    function addMenuSeparator(label) {
        const separator =
            document.createElement("div");

        separator.className = "menu-separator";
        separator.textContent = "── " + label + " ──";

        platformList.appendChild(separator);
    }

    /*
     * CREATE MENU LINK
     */
    function addMenuLink(label, url) {
        const link =
            document.createElement("a");

        link.className = "platform-button";
        link.href = url;
        link.textContent = label;

        link.addEventListener("click", closeMenu);

        platformList.appendChild(link);
    }

    /*
     * GROUP PLATFORMS FOR DISPLAY
     *
     * These groups affect only menu organization.
     * The link always uses the original PLATFORM value.
     */
    function getPlatformGroup(platform) {
        const normalized = normalizeText(platform);

        if (
            normalized === "others" ||
            normalized === "other"
        ) {
            return "Others";
        }

        if (normalized.includes("playstation")) {
            return "PlayStation";
        }

        if (normalized.startsWith("xbox")) {
            return "Xbox";
        }

        if (
            normalized.includes("nintendo") ||
            normalized.includes("game boy") ||
            normalized.includes("gameboy") ||
            normalized.includes("gamecube") ||
            normalized === "nes"
        ) {
            return "Nintendo";
        }

        return "Other Platforms";
    }

    /*
     * BUILD THE PLATFORM MENU FROM THE SHEET
     */
    function displayPlatformMenu(platforms) {
        platformList.replaceChildren();

        addMenuLink(
            "Multi-Game Apps",
            "index.html?category=multi-game-apps"
        );

        const groupOrder = [
            "Nintendo",
            "PlayStation",
            "Xbox",
            "Others",
            "Other Platforms"
        ];

        const grouped = new Map();

        for (const group of groupOrder) {
            grouped.set(group, []);
        }

        for (const platform of platforms) {
            const group = getPlatformGroup(platform);

            if (!grouped.has(group)) {
                grouped.set(group, []);
            }

            grouped.get(group).push(platform);
        }

        let renderedCount = 0;

        for (const group of groupOrder) {
            const entries = grouped.get(group) || [];

            if (entries.length === 0) {
                continue;
            }

            addMenuSeparator(group);

            for (const platform of entries) {
                addMenuLink(
                    platform,
                    "index.html?platform=" +
                        encodeURIComponent(platform)
                );

                renderedCount++;
            }
        }

        if (renderedCount === 0) {
            const message =
                document.createElement("div");

            message.className = "menu-separator";
            message.textContent = "No platforms found.";

            platformList.appendChild(message);
        }
    }

    /*
     * SEARCH BUTTON
     */
    searchButton.addEventListener("click", function () {
        const opening = searchContainer.hidden;

        searchContainer.hidden = !opening;

        searchButton.setAttribute(
            "aria-expanded",
            String(opening)
        );

        if (opening) {
            searchInput.focus();
        } else {
            searchInput.value = "";
            searchResults.replaceChildren();
            searchResults.hidden = true;
        }
    });

    /*
     * SEARCH WHILE TYPING
     */
    searchInput.addEventListener("input", function () {
        const query = normalizeText(searchInput.value);

        searchResults.replaceChildren();

        if (!query) {
            searchResults.hidden = true;
            return;
        }

        const matches = gameNames
            .filter(game =>
                normalizeText(game.name).includes(query)
            )
            .sort((a, b) => {
                const nameA = normalizeText(a.name);
                const nameB = normalizeText(b.name);

                const aStarts = nameA.startsWith(query);
                const bStarts = nameB.startsWith(query);

                if (aStarts !== bStarts) {
                    return aStarts ? -1 : 1;
                }

                return a.name.localeCompare(b.name);
            })
            .slice(0, 5);

        for (const game of matches) {
            const link =
                document.createElement("a");

            link.className = "search-result";
            link.href =
                "game.html?game=" +
                encodeURIComponent(game.slug);

            link.textContent = game.name;

            searchResults.appendChild(link);
        }

        searchResults.hidden = matches.length === 0;
    });

    /*
     * LOAD GAME NAMES AND PLATFORMS
     */
    async function loadMenuData() {
        try {
            const response = await fetch(
                "https://docs.google.com/spreadsheets/d/1CO7dH7mbj9sl67g4e94wczHESp0NAsOa7_chKKii9OA/export?format=csv",
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error(
                    "Could not load the spreadsheet."
                );
            }

            const csv = await response.text();
            const rows = parseCSV(csv);

            if (rows.length < 2) {
                throw new Error(
                    "The spreadsheet contains no game rows."
                );
            }

            const headers = rows.shift().map(normalizeHeader);

            const gameIndex = headers.findIndex(header =>
                [
                    "GAME",
                    "GAME NAME",
                    "NAME",
                    "JUEGO"
                ].includes(header)
            );

            const platformIndex = headers.findIndex(header =>
                [
                    "PLATFORM",
                    "PLATAFORM",
                    "PLATAFORMA"
                ].includes(header)
            );

            if (gameIndex < 0) {
                throw new Error(
                    "The GAME column was not found."
                );
            }

            if (platformIndex < 0) {
                throw new Error(
                    "The PLATFORM column was not found."
                );
            }

            const names = new Map();
            const platforms = new Map();

            for (const row of rows) {
                const name = String(
                    row[gameIndex] || ""
                ).trim();

                const platform = normalizePlatformLabel(
                    row[platformIndex]
                );

                if (name) {
                    const normalizedName =
                        normalizeText(name);

                    const slug = normalizedName
                        .replace(/[^a-z0-9]+/g, "-")
                        .replace(/^-+|-+$/g, "");

                    if (!names.has(slug)) {
                        names.set(slug, {
                            name,
                            slug
                        });
                    }
                }

                if (platform) {
                    const key = normalizeText(platform);

                    /*
                     * Multi-Game Apps has its own category link.
                     */
                    if (
                        key === "multi-game apps" ||
                        key === "multi game apps"
                    ) {
                        continue;
                    }

                    if (!platforms.has(key)) {
                        platforms.set(key, platform);
                    }
                }
            }

            gameNames = Array.from(names.values());

            const platformListFromSheet =
                Array.from(platforms.values());

            displayPlatformMenu(platformListFromSheet);

        } catch (error) {
            console.error(
                "Menu data could not be loaded:",
                error
            );

            platformList.replaceChildren();

            const message =
                document.createElement("div");

            message.className = "menu-separator";
            message.textContent =
                "Could not load platforms. Please try again later.";

            platformList.appendChild(message);
        }
    }

    loadMenuData();
</script>

<script type="module" src="game.js"></script>

</body>
</html>
