<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google AdSense -->
    <script async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6826586907052847"
        crossorigin="anonymous">
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Details — NAPL</title>
    <meta
        name="description"
        content="Explore native Android ports, supported versions, compatibility information, and details for your favorite games."
    >
    <meta name="theme-color" content="#11221b">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="assets/css/main.css?v=6">
    <link rel="stylesheet" href="assets/css/components.css?v=6">
    <link rel="stylesheet" href="assets/css/loading.css?v=6">
    <link rel="stylesheet" href="assets/css/game.css?v=6">
    <link rel="stylesheet" href="assets/css/skeleton.css?v=6">
</head>

<body>
<header>
    <button
        id="menu-button"
        type="button"
        aria-label="Open menu"
        aria-controls="side-menu"
        aria-expanded="false"
    >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" y1="7" x2="20" y2="7"/>
            <line x1="4" y1="12" x2="20" y2="12"/>
            <line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
    </button>

    <h1 id="home-button" role="button" tabindex="0">NAPL</h1>

    <div class="header-actions">
        <button
            id="search-button"
            type="button"
            aria-label="Open search"
            aria-controls="search-container"
            aria-expanded="false"
        >
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.3-4.3"/>
            </svg>
        </button>
    </div>
</header>

<div id="menu-overlay"></div>

<nav id="side-menu" aria-label="Menu">
    <div class="side-menu-header">
        <div class="side-menu-brand">
            <span class="side-menu-title">NAPL</span>
            <span class="side-menu-subtitle">Android Port Index</span>
        </div>
        <button id="menu-close" type="button" aria-label="Close menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 6 6 18"/>
                <path d="m6 6 12 12"/>
            </svg>
        </button>
    </div>

    <div class="side-menu-body">
        <button id="all-games-button" type="button" class="platform-button platform-button-primary">
            All Games
        </button>

    <h2>Categories</h2>
    <button
        type="button"
        class="platform-button"
        data-category="multi-game-apps"
    >
        Multi-Game Apps
    </button>
    <button
        type="button"
        class="platform-button"
        data-category="dual-screen"
    >
        Dual Screen
    </button>

    <h2>Platforms</h2>
    <div id="platform-list"></div>
    </div>
</nav>

<main>
    <div id="search-container" class="search-container" hidden>
        <input
            type="search"
            id="search"
            placeholder="Search games, ports or developers..."
            aria-label="Search games"
            autocomplete="off"
        >
        <div id="search-results" class="search-results" hidden></div>
    </div>

    <div class="game-top-bar">
        <button id="back-button" type="button" class="back-button">
            ← Back
        </button>
    </div>

    <div id="game-header"></div>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="port-list" class="port-list"></div>
</main>

<footer>
    <p>Native Android Port List</p>
</footer>

<script type="module" src="js/pages/game.js"></script>
</body>
</html>
