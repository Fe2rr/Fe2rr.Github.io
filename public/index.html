<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#11221b">

    <meta

        content="NAPL — Native Android Port List. Discover, explore and track native Android game ports."
    >

    <!-- SEO -->

    <!-- Open Graph -->
    <meta property="og:type" content="website">

        property="og:description"
        content="Discover, explore and track native Android game ports."

    <meta property="og:url" content="https://fe2rr.github.io/Napl-prueba/">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "NAPL",
        "alternateName": "NAPL — Native Android Port List",
        "url": "https://fe2rr.github.io/Napl-prueba/"
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <script>
        (function () {
            try {
                var saved = localStorage.getItem("napl_theme_v1");
                document.documentElement.setAttribute(
                    "data-theme",
                    saved === "light" ? "light" : "dark"
                );
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>

    <link rel="stylesheet" href="assets/css/main.css?v=8">
    <link rel="stylesheet" href="assets/css/components.css?v=7">
    <link rel="stylesheet" href="assets/css/loading.css?v=7">
    <link rel="stylesheet" href="assets/css/home.css?v=7">
    <link rel="stylesheet" href="assets/css/skeleton.css?v=7">
</head>

<body class="home-page">

<header>
    <button
        id="menu-button"
        type="button"
        aria-label="Open menu"
        aria-controls="side-menu"
        aria-expanded="false"
    >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" y1="7" x2="20" y2="7"/>
            <line x1="4" y1="12" x2="20" y2="12"/>
            <line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
    </button>

    <h1 id="home-button" role="button" tabindex="0">NAPL</h1>

    <div class="header-actions">
        <button
            id="theme-toggle"
            type="button"
            aria-label="Cambiar a modo oscuro"
            aria-pressed="true"
        ></button>
        <button
            id="search-button"
            type="button"
            aria-label="Open search"
            aria-controls="search-container"
            aria-expanded="false"
        >
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.3-4.3"/>
            </svg>
        </button>
    </div>
</header>

<div id="menu-overlay"></div>

<nav id="side-menu" aria-label="Menu">
    <div class="side-menu-header">
        <div class="side-menu-brand">
            <span class="side-menu-title">NAPL</span>
            <span class="side-menu-subtitle">Android Port Index</span>
        </div>
        <button id="menu-close" type="button" aria-label="Close menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 6 6 18"/>
                <path d="m6 6 12 12"/>
            </svg>
        </button>
    </div>

    <div class="side-menu-body">
        <button id="all-games-button" type="button" class="platform-button platform-button-primary">
            All Games
        </button>

    <h2>Categories</h2>
    <button
        type="button"
        class="platform-button"
        data-category="multi-game-apps"
    >
        Multi-Game Apps
    </button>
    <button
        type="button"
        class="platform-button"
        data-category="dual-screen"
    >
        Dual Screen
    </button>

    <h2>Platforms</h2>
    <div id="platform-list"></div>
    </div>
</nav>

<main>
    <div id="search-container" class="search-container" hidden>
        <input
            type="search"
            id="search"
            placeholder="Search games, ports or developers..."
            aria-label="Search games"
            autocomplete="off"
        >
        <div id="search-results" class="search-results" hidden></div>
    </div>

    <div class="home-hero">
        <h2 class="home-hero-title">Native Android Port List</h2>
        <p class="home-hero-subtitle">Discover, compare, and track native game ports for Android.</p>
    </div>

    <nav id="home-tabs" class="home-tabs" aria-label="Home sections">
        <button
            type="button"
            class="home-tab active"
            data-section="last-added"
            aria-selected="true"
        >
            Last Added
        </button>
        <button
            type="button"
            class="home-tab"
            data-section="popular"
            aria-selected="false"
        >
            Popular
        </button>
        <button
            type="button"
            class="home-tab"
            data-section="last-updated"
            aria-selected="false"
        >
            Last Updated
        </button>
    </nav>

    <section id="last-added-section" class="home-section">
        <div id="last-added-list" class="home-list"></div>
        <button id="last-added-more" type="button" class="view-more-button" hidden>
            View more
        </button>
    </section>

    <section id="popular-section" class="home-section" hidden>
        <div class="home-section-header">
            <div class="popular-tabs" role="group" aria-label="Popular period">
                <button
                    type="button"
                    class="popular-tab active"
                    data-period="week"
                    aria-pressed="true"
                >
                    Week
                </button>
                <button
                    type="button"
                    class="popular-tab"
                    data-period="month"
                    aria-pressed="false"
                >
                    Month
                </button>
                <button
                    type="button"
                    class="popular-tab"
                    data-period="alltime"
                    aria-pressed="false"
                >
                    All Time
                </button>
            </div>
        </div>
        <div id="popular-list" class="home-list"></div>
        <button id="popular-more" type="button" class="view-more-button" hidden>
            View more
        </button>
    </section>

    <section id="last-updated-section" class="home-section" hidden>
        <div id="last-updated-list" class="home-list"></div>
        <button id="last-updated-more" type="button" class="view-more-button" hidden>
            View more
        </button>
    </section>

    <div id="category-controls" class="category-controls" hidden>
        <input
            type="search"
            id="category-search"
            placeholder="Filter this list..."
            aria-label="Filter games in category"
            autocomplete="off"
        >

        <div class="category-sort-row">
            <div class="category-sort" role="group" aria-label="Sort games">
                <button
                    type="button"
                    class="category-sort-option active"
                    data-sort="updated"
                >
                    Updated
                </button>
                <button
                    type="button"
                    class="category-sort-option"
                    data-sort="name"
                >
                    A–Z
                </button>
                <button
                    type="button"
                    class="category-sort-option"
                    data-sort="popular"
                >
                    Popular
                </button>
            </div>

            <button
                type="button"
                id="category-sort-direction"
                class="category-sort-direction"
                aria-label="Toggle sort direction"
            >
                ↓
            </button>
        </div>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
    <div id="game-list" class="game-list" hidden></div>

    <section class="napl-ad" aria-label="Advertisement">
        <p class="napl-ad-label">Advertisement</p>
        <div class="napl-ad-frame">
            <iframe
                data-aa="2462057"
                src="//ad.a-ads.com/2462057/?size=300x250"
                title="Advertisement"
                loading="lazy"
                scrolling="no"
                style="border:0; padding:0; width:300px; max-width:100%; height:250px; overflow:hidden; display:block; margin:auto"
            ></iframe>
        </div>
    </section>
</main>

<footer>
    <p>Native Android Port List</p>
</footer>

<script type="module" src="js/pages/home.js"></script>
</body>
</html>
